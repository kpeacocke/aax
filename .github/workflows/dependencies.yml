name: Dependency Management

on:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: dependency-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-fix-inventory:
    name: Inventory Image Fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export all open image alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tool in Trivy Grype; do
            gh api --paginate "/repos/$REPOSITORY/code-scanning/alerts?state=open&tool_name=$tool&per_page=100" \
              --jq '.[] | {number,rule_id:.rule.id,severity:.rule.security_severity_level,tool:.tool.name,help:.rule.help,message:.most_recent_instance.message.text,category:.most_recent_instance.category,ref:.most_recent_instance.ref,path:.most_recent_instance.location.path,commit:.most_recent_instance.commit_sha,url:.html_url}' \
              >> image-alerts.jsonl.tmp
          done
          mv image-alerts.jsonl.tmp image-alerts.jsonl
      - name: Group advisories and retain every affected scope
        run: python3 scripts/report-image-fixes.py image-alerts.jsonl image-fix-inventory.json
      - name: Summarize patch queue
        run: |
          set -euo pipefail
          {
            echo '## Image vulnerability fix inventory'
            jq -r '"\(.alert_count) alerts grouped into \(.advisory_package_count) advisory/package pairs.",
              "\(.status_counts.scanner_reported_fix) pairs have scanner-reported fixes; \(.status_counts.no_fix_reported) have no reported fix; \(.status_counts.fix_metadata_missing) need missing metadata investigated."' \
              image-fix-inventory.json
            echo 'No findings are dismissed. Reported fixes require availability checks and fresh exact-image scans.'
            echo '| Advisory | Package | Severity | Reported fixed versions | Alerts |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r '.findings[] | select(.status == "scanner_reported_fix") |
              "| \(.advisory) | \(.package) | \(.severity) | \(.reported_fixed_versions | join(", ")) | \(.alert_count) |"' \
              image-fix-inventory.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-fix-inventory
          path: |
            image-alerts.jsonl
            image-fix-inventory.json
          if-no-files-found: error

  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pip-audit

      - name: Audit Python dependencies
        id: audit-command
        run: |
          set -euo pipefail
          status=0
          PIP_CONSTRAINT="$PWD/images/ee-base/constraints.txt" \
            pip-audit -r images/ee-base/requirements.txt \
              -r images/ee-builder/requirements.txt \
              -r images/dev-tools/requirements.txt \
              --format json --output audit-results.json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::Dependency audit failed (exit $status)"
            exit "$status"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          direct_status=0
          pip-audit --disable-pip --no-deps \
            -r images/ee-base/requirements.txt \
            -r images/ee-builder/requirements.txt \
            -r images/dev-tools/requirements.txt \
            --format json --output audit-direct-results.json || direct_status=$?
          if [ "$direct_status" -gt 1 ]; then
            echo "::error::Direct dependency audit failed (exit $direct_status)"
            exit "$direct_status"
          fi
          echo "direct-status=$direct_status" >> "$GITHUB_OUTPUT"

      - name: Validate audit and reconcile dependency issues
        id: audit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/reconcile-dependency-audit.cjs')({
              github, context, core
            });
        env:
          AUDIT_EXIT_STATUS: ${{ steps.audit-command.outputs.status }}
          AUDIT_DIRECT_EXIT_STATUS: ${{ steps.audit-command.outputs.direct-status }}

      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: |
            audit-results.json
            audit-direct-results.json
          if-no-files-found: error

      - name: Fail on vulnerable dependencies
        if: steps.audit.outputs.vulnerabilities == 'true'
        run: exit 1

  stale-management:
    name: Manage Stale Issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Stale bot
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions."
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs."
          close-issue-message: "This issue was automatically closed due to inactivity."
          close-pr-message: "This PR was automatically closed due to inactivity."
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security"

name: Dependency Management

on:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pip-audit safety

      - name: Audit Python dependencies
        id: audit
        run: |
          set -euo pipefail
          status=0
          PIP_CONSTRAINT="$PWD/images/ee-base/constraints.txt" \
            pip-audit -r images/ee-base/requirements.txt \
              -r images/ee-builder/requirements.txt \
              -r images/dev-tools/requirements.txt \
              --format json --output audit-results.json || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::Dependency audit failed (exit $status)"
            exit "$status"
          fi
          if jq -e '[.dependencies[].vulns[]] | length > 0' audit-results.json >/dev/null; then
            echo "vulnerabilities=true" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for vulnerabilities
        if: steps.audit.outputs.vulnerabilities == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));

            const body = `## 🔒 Security Vulnerabilities Detected

            Automated scan found vulnerabilities in Python dependencies.

            \`\`\`json
            ${JSON.stringify(audit, null, 2)}
            \`\`\`

            Please review and update affected packages.`;

            const title = '🔒 Security: Vulnerable dependencies detected';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body,
              labels: ['security', 'dependencies']
            };
            if (existing) {
              await github.rest.issues.update({...params, issue_number: existing.number});
            } else {
              await github.rest.issues.create(params);
            }

      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: audit-results.json
          if-no-files-found: error

      - name: Fail on vulnerable dependencies
        if: steps.audit.outputs.vulnerabilities == 'true'
        run: exit 1

  stale-management:
    name: Manage Stale Issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Stale bot
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions."
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs."
          close-issue-message: "This issue was automatically closed due to inactivity."
          close-pr-message: "This PR was automatically closed due to inactivity."
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security"

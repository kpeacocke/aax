name: Test and publish AWX UI runtime
on:
  push:
    branches: [main, fix/awx-devel-ui]
    paths: [images/awx-ui-runtime/**, .github/workflows/awx-ui-runtime.yml]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [images/awx-ui-runtime/**, .github/workflows/awx-ui-runtime.yml]
permissions:
  contents: read
  packages: write
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend-preserving UI repair
        run: docker build -t aax-awx-ui-test images/awx-ui-runtime
      - name: Verify Django template and static assets
        run: |
          docker run --rm --entrypoint /var/lib/awx/venv/awx/bin/python \
            -e AWX_MODE=defaults -e SKIP_SECRET_KEY_CHECK=yes -e SKIP_PG_VERSION_CHECK=yes \
            -e DJANGO_SETTINGS_MODULE=awx.settings aax-awx-ui-test -c '
          import django, pathlib
          django.setup()
          from django.template.loader import get_template
          template = get_template("index_awx.html")
          assert "/static/awx/" in template.template.source
          assert list(pathlib.Path("/var/lib/awx/public/static/awx").rglob("*.js"))
          print("AWX UI template and compiled JavaScript present")'
      - name: Publish tested image
        if: github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/aax-awx:ui-${REVISION}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Image tag already exists; leaving it unchanged"
            exit 0
          fi
          docker tag aax-awx-ui-test "$image"
          docker push "$image"

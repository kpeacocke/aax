name: Enforce Gitflow Branch Names

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch name follows gitflow
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch name: $BRANCH_NAME"

          # Allow specific gitflow branch patterns plus common automation branch prefixes
          if [[ "$BRANCH_NAME" =~ ^(feature|feat|bugfix|fix|hotfix|release|chore|docs|ci|perf|refactor|test|build|deps)/[a-z0-9._-]+$ ]] || \
             [[ "$BRANCH_NAME" =~ ^(dependabot|renovate)/ ]] || \
             [[ "$BRANCH_NAME" == "develop" ]] || \
             [[ "$BRANCH_NAME" == "main" ]]; then
            echo "✓ Branch name follows the repository branch convention"
            exit 0
          else
            echo "✗ Branch name does not follow the repository branch convention"
            echo ""
            echo "Valid branch names:"
            echo "  feature/<description>  - New features"
            echo "  feat/<description>     - New features (alias)"
            echo "  bugfix/<description>   - Bug fixes"
            echo "  fix/<description>      - General fixes"
            echo "  hotfix/<description>   - Emergency fixes"
            echo "  release/<version>      - Release preparation"
            echo "  chore/<description>    - Maintenance work"
            echo "  docs/<description>     - Documentation work"
            echo "  dependabot/<package>   - Dependency updates"
            echo "  develop                - Integration branch"
            echo "  main                   - Main branch"
            echo ""
            echo "Examples:"
            echo "  feature/add-redis-support"
            echo "  feat/add-redis-support"
            echo "  fix/fix-port-binding"
            echo "  hotfix/security-patch"
            echo "  release/1.2.0"
            echo "  dependabot/github_actions/docker/metadata-action-6.1.0"
            exit 1
          fi

  check-target-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR target follows gitflow
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source: $SOURCE_BRANCH → Target: $TARGET_BRANCH"

          # Gitflow rules:
          # feature/*, feat/* and bugfix/* → develop (or main for direct PRs)
          # release/* → main
          # hotfix/* → main (and should also merge to develop)
          # develop → main (for releases)

          VALID=false

          if [[ "$SOURCE_BRANCH" =~ ^(feature|feat|bugfix|fix|chore|docs|ci|perf|refactor|test|build|deps|dependabot|renovate)/ ]] && [[ "$TARGET_BRANCH" =~ ^(develop|main)$ ]]; then
            VALID=true
          elif [[ "$SOURCE_BRANCH" =~ ^(hotfix|release)/ ]] && [[ "$TARGET_BRANCH" == "main" ]]; then
            VALID=true
          elif [[ "$SOURCE_BRANCH" == "develop" ]] && [[ "$TARGET_BRANCH" == "main" ]]; then
            VALID=true
          fi

          if [ "$VALID" = true ]; then
            echo "✓ PR target branch follows gitflow convention"
            exit 0
          else
            echo "✗ Invalid PR target branch for gitflow"
            echo ""
            echo "Gitflow merge rules:"
            echo "  feature/*, feat/* or bugfix/* → develop or main"
            echo "  release/* or hotfix/*  → main"
            echo "  develop               → main (for releases)"
            echo ""
            echo "Your PR: $SOURCE_BRANCH → $TARGET_BRANCH"
            exit 1
          fi

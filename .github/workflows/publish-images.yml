name: Publish Images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".github/workflows/publish-images.yml"
      - "scripts/check-vulnerability-reports.sh"
      - "scripts/scan-image-candidate.sh"
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1"

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-ee-base:
    name: Build and Push ee-base
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/aax-ee-base
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short

      - name: Build and push ee-base
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./images/ee-base
          file: ./images/ee-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_PREFIX }}/aax-ee-base:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            VERSION=latest
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=ee-base
          cache-to: type=gha,mode=max,scope=ee-base

      - name: Install image scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Scan candidate on both architectures before promotion
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/aax-ee-base@${{ steps.build.outputs.digest }}
        run: bash scripts/scan-image-candidate.sh "$IMAGE" published-ee-base

      - name: Upload candidate findings
        if: always() && hashFiles('image-sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: image-sarif

      - name: Preserve candidate reports
        if: always() && hashFiles('image-reports/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-ee-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-reports/
            image-sarif/

      - name: Promote scanned candidate
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.IMAGE_PREFIX }}/aax-ee-base@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE"

  build-and-push:
    name: Build and Push ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [build-ee-base]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ee-builder
            context: ./images/ee-builder
            file: ./images/ee-builder/Dockerfile
            use_base: true
          - name: dev-tools
            context: ./images/dev-tools
            file: ./images/dev-tools/Dockerfile
            use_base: true
          - name: gateway
            context: ./images/gateway
            file: ./images/gateway/Dockerfile
            use_base: false
          - name: pulp
            context: ./images/pulp
            file: ./images/pulp/Dockerfile.pulp
            use_base: false
          - name: galaxy-ng
            context: ./images/galaxy-ng
            file: ./images/galaxy-ng/Dockerfile
            use_base: false
          - name: eda-controller
            context: ./images/eda-controller
            file: ./images/eda-controller/Dockerfile
            use_base: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/aax-${{ matrix.image.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short

      - name: Compute base image argument
        id: base
        env:
          BASE_DIGEST: ${{ needs.build-ee-base.outputs.digest }}
        run: |
          if [ "${{ matrix.image.use_base }}" = "true" ]; then
            echo "value=BASE_IMAGE=${{ env.IMAGE_PREFIX }}/aax-ee-base@$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.image.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_PREFIX }}/aax-${{ matrix.image.name }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            VERSION=latest
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            ${{ steps.base.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Install image scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0

      - name: Scan candidate on both architectures before promotion
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/aax-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
        run: bash scripts/scan-image-candidate.sh "$IMAGE" "published-${{ matrix.image.name }}"

      - name: Upload candidate findings
        if: always() && hashFiles('image-sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: image-sarif

      - name: Preserve candidate reports
        if: always() && hashFiles('image-reports/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.image.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-reports/
            image-sarif/

      - name: Promote scanned candidate
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.IMAGE_PREFIX }}/aax-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE"

name: Publish upstream devel bundle

on:
  workflow_dispatch:
    inputs:
      awx_ref:
        description: AWX ref to build
        required: false
        default: devel
      upstream_revisions:
        description: Optional JSON map of exact awx, awx-ee, receptor, ansible-rulebook and galaxy-ng commits
        required: false
        default: ''
      publish_latest_devel:
        description: Also move the mutable devel tag (main only)
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-devel.yml
      - docker-compose.devel.yml
      - docker-compose.yml
      - .env.example
      - images/**
      - scripts/build-rpm-security.sh
      - scripts/build-upstream.sh
      - scripts/check-vulnerability-reports.sh
      - scripts/*bundle*.sh
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: publish-devel-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: devel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  resolve-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out AAX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out upstream sources
        env:
          AWX_BRANCH: ${{ inputs.awx_ref || 'devel' }}
          AWX_EE_BRANCH: devel
          RECEPTOR_BRANCH: devel
          RULEBOOK_BRANCH: main
          GALAXY_NG_BRANCH: main
          UPSTREAM_REVISIONS: ${{ inputs.upstream_revisions }}
        run: |
          set -euo pipefail
          mkdir -p bundle-reports
          exec > >(tee bundle-reports/source-resolution.log) 2>&1
          if [[ -n "$UPSTREAM_REVISIONS" ]]; then
            jq --exit-status '
              type == "object" and
              (keys == ["ansible-rulebook", "awx", "awx-ee", "galaxy-ng", "receptor"]) and
              all(.[]; type == "string" and test("^[0-9a-f]{40}$"))
            ' <<< "$UPSTREAM_REVISIONS" >/dev/null
            AWX_BRANCH="$(jq -r '.awx' <<< "$UPSTREAM_REVISIONS")"
            AWX_EE_BRANCH="$(jq -r '."awx-ee"' <<< "$UPSTREAM_REVISIONS")"
            RECEPTOR_BRANCH="$(jq -r '.receptor' <<< "$UPSTREAM_REVISIONS")"
            RULEBOOK_BRANCH="$(jq -r '."ansible-rulebook"' <<< "$UPSTREAM_REVISIONS")"
            GALAXY_NG_BRANCH="$(jq -r '."galaxy-ng"' <<< "$UPSTREAM_REVISIONS")"
            export AWX_BRANCH AWX_EE_BRANCH RECEPTOR_BRANCH RULEBOOK_BRANCH GALAXY_NG_BRANCH
          fi
          ./scripts/build-upstream.sh
      - name: Record exact build sources
        run: |
          set -euo pipefail
          mkdir -p bundle-reports
          for name in awx awx-ee receptor ansible-rulebook galaxy-ng; do
            jq -n --arg name "$name" \
              --arg repository "$(git -C ".upstream/$name" remote get-url origin)" \
              --arg revision "$(git -C ".upstream/$name" rev-parse HEAD)" \
              '{name: $name, repository: $repository, revision: $revision}'
          done | jq -s --arg aax "$GITHUB_SHA" --arg tag "$IMAGE_TAG" \
            '{aax_revision: $aax, image_tag: $tag, sources: .}' > bundle-reports/sources.json
          cp images/eda-server/Dockerfile bundle-reports/eda-runtime.Dockerfile
          cp images/eda-podman/Dockerfile bundle-reports/eda-podman.Dockerfile
          cp images/eda-decision-environment/Dockerfile bundle-reports/eda-decision-environment.Dockerfile
          cp images/awx-ui-runtime/Dockerfile bundle-reports/awx-ui.Dockerfile
          cp -R images/runtime-security images/receptor-runtime images/galaxy-runtime \
            images/ee-base/pip-security images/hub-security images/drools-runtime \
            images/dab-security images/rpm-security bundle-reports/
          tar -czf upstream-sources.tar.gz .upstream
      - name: Preserve frozen sources and patch inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-input-sources-${{ github.run_attempt }}
          path: |
            upstream-sources.tar.gz
            bundle-reports/
          if-no-files-found: error
          retention-days: 90

  build-images:
    needs: resolve-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: [awx, awx-ee, receptor, ansible-rulebook, galaxy-ng, gateway, eda-controller, eda-podman, eda-decision-environment]
    steps:
      - &checkout
        name: Check out AAX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - &login
        name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle-input-sources-${{ github.run_attempt }}
      - name: Restore exact upstream sources
        run: |
          set -euo pipefail
          tar -xzf upstream-sources.tar.gz
          for name in awx awx-ee receptor ansible-rulebook galaxy-ng; do
            expected="$(jq -er --arg name "$name" '.sources[] | select(.name == $name) | .revision' bundle-reports/sources.json)"
            test "$(git -C ".upstream/$name" rev-parse HEAD)" = "$expected"
          done
      - name: Install upstream build tools
        run: python3 -m pip install --disable-pip-version-check ansible-core ansible-builder build
      - name: Build one upstream image
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          bash scripts/build-bundle-image.sh "$BUNDLE_IMAGE" 2>&1 | tee "bundle-reports/$BUNDLE_IMAGE-build.log"
      - name: Retain raw candidate by immutable digest
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
        run: bash scripts/bundle-candidate.sh push "$BUNDLE_IMAGE" raw
      - name: Preserve raw candidate identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-input-raw-${{ matrix.image }}-${{ github.run_attempt }}
          path: |
            candidate-maps/raw/
            bundle-reports/sources.json
            bundle-reports/${{ matrix.image }}-build.log
          if-no-files-found: error
          retention-days: 90

  native-tools:
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - *checkout
      - *buildx
      - *login
      - name: Download retained build inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-input-*-${{ github.run_attempt }}
          merge-multiple: true
      - name: Build shared signed source RPMs and FIPS compiler once
        run: |
          set -euo pipefail
          mkdir -p bundle-reports/rpm-security/logs
          exec > >(tee bundle-reports/rpm-security/logs/native-tools.log) 2>&1
          bash scripts/bundle-candidate.sh pull awx-ee raw
          runtime_user="$(docker image inspect --format '{{.Config.User}}' awx-ee:devel)"
          docker build -f images/runtime-security/OS.Dockerfile \
            --build-arg BASE_IMAGE=awx-ee:devel --build-arg RUNTIME_USER="${runtime_user:-root}" \
            -t awx-ee:os-patched images/runtime-security
          docker build -f images/ee-base/pip-security/Dockerfile -t pip-security:devel images/ee-base
          bash scripts/bundle-candidate.sh push pip-security tools
          RPM_RETAIN_COMPILER=true bash scripts/build-rpm-security.sh bundle-reports/rpm-security
      - name: Archive native outputs including signed source RPMs and failure logs
        if: always()
        run: |
          set -euo pipefail
          tar -czf native-rpms.tar.gz -C bundle-reports rpm-security
      - name: Preserve native build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-input-native-${{ github.run_attempt }}
          path: |
            native-rpms.tar.gz
            candidate-maps/tools/
          if-no-files-found: error
          retention-days: 90

  gate-foundations:
    needs: native-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: [receptor, ansible-rulebook]
    steps: &gate_steps
      - *checkout
      - *buildx
      - *login
      - name: Download retained image build inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-input-*-${{ github.run_attempt }}
          merge-multiple: true
      - name: Download exact scanned Receptor dependency
        if: matrix.image == 'awx-ee'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle-gate-receptor-${{ github.run_attempt }}
      - name: Download exact scanned rulebook dependency
        if: matrix.image == 'eda-decision-environment'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle-gate-ansible-rulebook-${{ github.run_attempt }}
      - name: Restore shared artifacts and this image only
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          tar -xzf upstream-sources.tar.gz
          tar -xzf native-rpms.tar.gz -C bundle-reports
          bash scripts/bundle-candidate.sh pull "$BUNDLE_IMAGE" raw
          bash scripts/bundle-candidate.sh pull pip-security tools
          docker tag pip-security:devel aax/pip-security:devel
          if [[ "$BUNDLE_IMAGE" == awx-ee ]]; then
            bash scripts/bundle-candidate.sh pull receptor gated
          elif [[ "$BUNDLE_IMAGE" == eda-decision-environment ]]; then
            bash scripts/bundle-candidate.sh pull ansible-rulebook gated
            docker tag ansible-rulebook:devel ansible-rulebook:patched
          fi
      - name: Apply maintained runtime security patches
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p bundle-reports
          bash scripts/patch-bundle-image.sh "$BUNDLE_IMAGE" 2>&1 | tee "bundle-reports/$BUNDLE_IMAGE-patch.log"
      - name: Retain final candidate before security gates
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          bash scripts/bundle-candidate.sh push "$BUNDLE_IMAGE" gated
          bash scripts/bundle-candidate.sh pull "$BUNDLE_IMAGE" gated
      - name: Reclaim only this disposable runner's build cache
        run: |
          set -euo pipefail
          timeout 180 docker buildx prune --all --force
          timeout 180 docker builder prune --all --force
          df -h .
      - name: Install bundle scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: Install supplemental OS scanner
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/grype.tar.gz" \
            https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          echo "64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
      - name: Scan exact bundle images
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
        run: bash scripts/scan-bundle-image.sh "$BUNDLE_IMAGE"
      - name: Gate on fixable high and critical bundle vulnerabilities
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          bash scripts/check-vulnerability-reports.sh \
            "bundle-reports/$BUNDLE_IMAGE.json" "bundle-reports/$BUNDLE_IMAGE-grype.json"
      - name: Give security reports distinct analysis identities
        if: always() && hashFiles('bundle-reports/*.sarif') != ''
        env:
          BUNDLE_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p bundle-sarif
          for name in "$BUNDLE_IMAGE"; do
            for scanner in trivy grype; do
              source="bundle-reports/$name.sarif"
              if [[ "$scanner" == grype ]]; then
                source="bundle-reports/$name-grype.sarif"
              fi
              [[ -f "$source" ]] || continue
              jq --arg id "devel-bundle/$scanner/$name/" \
                '.runs |= map(.automationDetails.id = $id)' \
                "$source" > "bundle-sarif/$scanner-$name.sarif"
            done
          done
      - name: Upload bundle security findings
        if: always() && hashFiles('bundle-sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bundle-sarif
      - name: Preserve bundle provenance and security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-gate-${{ matrix.image }}-${{ github.run_attempt }}
          path: |
            candidate-maps/gated/${{ matrix.image }}.json
            bundle-reports/${{ matrix.image }}*
            bundle-sarif/*-${{ matrix.image }}.sarif
          if-no-files-found: error
          retention-days: 90

  gate-images:
    needs: [native-tools, gate-foundations]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: [awx, awx-ee, galaxy-ng, gateway, eda-controller, eda-podman, eda-decision-environment]
    steps: *gate_steps

  validate-runtime:
    needs: [gate-foundations, gate-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *login
      - name: Download scanned runtime candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-gate-eda-*-${{ github.run_attempt }}
          merge-multiple: true
      - name: Load only scanned runtime digests on a fresh runner
        run: |
          set -euo pipefail
          bash scripts/bundle-candidate.sh pull eda-podman gated
          bash scripts/bundle-candidate.sh pull eda-decision-environment gated
      - name: Require nested VFS disk budget
        run: |
          set -euo pipefail
          df -h .
          available="$(df -PB1 . | awk 'END {print $4}')"
          required=$((20 * 1024 * 1024 * 1024))
          if (( available < required )); then
            echo "Nested VFS validation needs $required free bytes; only $available remain." >&2
            exit 1
          fi
      - name: Verify nested Podman execution and outbound HTTPS
        run: |
          set -euo pipefail
          exec > >(tee bundle-reports/nested-runtime.log) 2>&1
          network=aax-eda-backend-test
          volume=aax-eda-backend-storage-test
          cleanup() {
            docker logs aax-eda-podman-test || true
            docker rm -f aax-eda-podman-test >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network"
          docker volume create "$volume"
          docker tag eda-decision-environment:devel localhost/eda-decision-environment:devel
          docker run -d --name aax-eda-podman-test --privileged \
            --network "$network" --dns 1.1.1.1 \
            -v "$volume:/var/lib/containers/storage" eda-podman:devel
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec aax-eda-podman-test curl --fail --silent http://127.0.0.1:8888/_ping; then
              ready=true
              break
            fi
            test "$(docker inspect -f '{{.State.Running}}' aax-eda-podman-test)" = true
            sleep 2
          done
          test "$ready" = true
          docker save localhost/eda-decision-environment:devel \
            | docker exec -i aax-eda-podman-test podman load
          docker run --rm --network "$network" --entrypoint podman eda-podman:devel \
            --remote --url tcp://aax-eda-podman-test:8888 info
          docker run --rm --network "$network" --entrypoint podman eda-podman:devel \
            --remote --url tcp://aax-eda-podman-test:8888 pull \
            quay.io/prometheus/busybox@sha256:7379672d53c28113469275f2eb48adffa19954f39f8ef20c1e2992278f658e6c
          docker run --rm --network "$network" --entrypoint podman eda-podman:devel \
            --remote --url tcp://aax-eda-podman-test:8888 run --rm \
            localhost/eda-decision-environment:devel python3.12 -c \
            "import urllib.request; assert urllib.request.urlopen('https://api.github.com', timeout=20).status == 200"
          docker run --rm -i --network "$network" --entrypoint podman eda-podman:devel \
            --remote --url tcp://aax-eda-podman-test:8888 run --rm -i \
            localhost/eda-decision-environment:devel ansible-rulebook \
            --rulebook /dev/stdin --shutdown-delay 1 < tests/fixtures/eda-smoke.yml \
            | tee bundle-reports/eda-rulebook-smoke.log
          grep -Fq AAX_DECISION_SECURITY_SMOKE_PASSED bundle-reports/eda-rulebook-smoke.log
          jq -n --slurpfile podman candidate-maps/gated/eda-podman.json \
            --slurpfile decision candidate-maps/gated/eda-decision-environment.json \
            '{podman: $podman[0], decision: $decision[0]}' > bundle-reports/runtime-gate.json
      - name: Preserve runtime evidence on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-runtime-${{ github.run_attempt }}
          path: |
            candidate-maps/gated/eda-podman.json
            candidate-maps/gated/eda-decision-environment.json
            bundle-reports/nested-runtime.log
            bundle-reports/eda-rulebook-smoke.log
            bundle-reports/runtime-gate.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [resolve-sources, build-images, native-tools, gate-foundations, gate-images, validate-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *buildx
      - *login
      - name: Download all exact candidate identities and evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-*-${{ github.run_attempt }}
          merge-multiple: true
      - name: Verify complete bundle evidence before any publication
        run: bash scripts/verify-bundle-evidence.sh
      - name: Tag and push bundle
        env:
          PUSH_MUTABLE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish_latest_devel) }}
        run: bash scripts/promote-bundle.sh
      - name: Preserve complete bundle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bundle-reports/
            bundle-sarif/
            candidate-maps/
            native-rpms.tar.gz
          if-no-files-found: error
          retention-days: 90

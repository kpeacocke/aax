# Dependabot configuration for AAX
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Docker images in docker-compose files
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/images/ee-base"
      - "/images/ee-builder"
      - "/images/dev-tools"
      - "/images/gateway"
      - "/images/awx"
      - "/images/awx-ui-runtime"
      - "/images/galaxy-ng"
      - "/images/pulp"
      - "/images/eda-controller"
      - "/images/eda-server"
      - "/images/awx-ee-runtime"
      - "/images/dab-security"
      - "/images/drools-runtime"
      - "/images/galaxy-runtime"
      - "/images/hub-security"
      - "/images/receptor-runtime"
      - "/images/rpm-security"
      - "/images/runtime-security"
      - "/images/ee-base/pip-security"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  - package-ecosystem: "pip"
    directories:
      - "/.devcontainer"
      - "/images/ee-base"
      - "/images/ee-builder"
      - "/images/dev-tools"
      - "/images/dab-security"
      - "/images/runtime-security"
      - "/images/ee-base/pip-security"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      python-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # DAB's pinned referencing<0.37.0 conflicts with this release.
      - dependency-name: "openapi-spec-validator"
        versions:
          - "0.9.0"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

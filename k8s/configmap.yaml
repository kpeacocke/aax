---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aax-config
  namespace: aax
  labels:
    app.kubernetes.io/name: aax-config
    app.kubernetes.io/part-of: aax
data:
  ANSIBLE_NOCOWS: "1"
  PYTHONUNBUFFERED: "1"
  PIP_NO_CACHE_DIR: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  EDA_ALLOWED_HOSTS: '["localhost","127.0.0.1","eda-controller","eda-ws","gateway","awx.ambitiouscake.com"]'
  EDA_CSRF_TRUSTED_ORIGINS: '["https://awx.ambitiouscake.com"]'
  EDA_RESOURCE_SERVER__URL: "@none None"
  EDA_ALLOW_LOCAL_RESOURCE_MANAGEMENT: "true"
  EDA_CONTROLLER_URL: "https://awx.ambitiouscake.com"
  EDA_CONTROLLER_SSL_VERIFY: "true"
  EDA_WEBSOCKET_BASE_URL: "wss://awx.ambitiouscake.com/eda/ws"
  EDA_WEBSOCKET_SSL_VERIFY: "yes"
  EDA_RULEBOOK_READINESS_TIMEOUT_SECONDS: "60"

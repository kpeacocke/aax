---
pi_ansible_authorized_key: >-
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQzyoP3xzirCsCsuJ7gEO1bp0fbekgebkVxb8AcAhtB awx@ambitiouscake-pi-fleet

pi_apply_dist_upgrade: true
pi_reboot_when_required: true
pi_reboot_timeout: 900
pi_post_reboot_delay: 20
pi_required_services:
  - docker
pi_required_containers: []
pi_reconcile_portainer_agent: false

# Change this one value immediately after deliberately upgrading Portainer
# Server. Agents must remain on the same version as the server.
portainer_server_version: 2.45.0
portainer_agent_image: "portainer/agent:{{ portainer_server_version }}-alpine"
portainer_agent_git_commit: 0f3812e
portainer_agent_container_name: portainer_agent
portainer_agent_restart_policy: always
portainer_agent_install_dir: /opt/portainer-agent
portainer_agent_port: 9001
portainer_agent_bind_address: 0.0.0.0

pi_guard_endpoints: []

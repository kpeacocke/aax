---
all:
  children:
    raspberry_pi:
      vars:
        ansible_user: "{{ lookup('env', 'PI_SSH_USER') | default('ansible', true) }}"
        ansible_python_interpreter: /usr/bin/python3
        portainer_agent_image: "portainer/agent:2.45.0"
        portainer_agent_port: 9001
        portainer_agent_bind_address: 0.0.0.0
        portainer_agent_install_dir: /opt/portainer-agent
      children:
        # Order is deliberate: ordinary workloads first, shared mDNS last.
        # AWX schedules launch the single orchestrator playbook, which imports
        # these waves sequentially and stops on the first failed host.
        pi_patch_wave_1:
          hosts:
            pi-terror:
        pi_patch_wave_2:
          hosts:
            pi-harmony:
        pi_patch_wave_3:
          hosts:
            pi-mdns:

    draytek:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: ansible.netcommon.default
        ansible_command_timeout: 60
      hosts: {}

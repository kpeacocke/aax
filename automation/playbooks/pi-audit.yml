---
- name: Audit Raspberry Pi and Portainer agent state without changes
  hosts: raspberry_pi
  become: true
  gather_facts: true
  strategy: free
  vars_files:
    - ../inventories/home/group_vars/raspberry_pi.yml
  tasks:
    - name: Inspect Docker
      ansible.builtin.service_facts:

    - name: Inspect the Portainer agent
      community.docker.docker_container_info:
        name: "{{ portainer_agent_container_name }}"
      register: agent

    - name: Report compliance
      ansible.builtin.assert:
        that:
          - ansible_facts.services['docker.service'].state == 'running'
          - agent.exists
          - agent.container.State.Running
          - agent.container.Config.Labels.git_commit == portainer_agent_git_commit
        fail_msg: >-
          Portainer agent is not the approved {{ portainer_server_version }} build
          (expected commit {{ portainer_agent_git_commit }}, found
          {{ agent.container.Config.Labels.git_commit | default('unknown') }} from
          {{ agent.container.Config.Image | default('unknown image') }}).

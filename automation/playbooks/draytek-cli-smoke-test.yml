---
- name: Verify read-only DrayTek switch CLI access
  hosts: draytek_managed_switches
  gather_facts: false
  serial: 1
  vars:
    draytek_read_only_command: show version
    draytek_managed_switch_addresses:
      MilSwitch: 192.168.5.2
      KPOffice: 192.168.5.3
    ansible_host: "{{ draytek_managed_switch_addresses[inventory_hostname] }}"
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: ansible.netcommon.default
    ansible_network_cli_ssh_type: paramiko
    ansible_command_timeout: 20
  tasks:
    - name: Run a read-only CLI command
      ansible.netcommon.cli_command:
        command: "{{ draytek_read_only_command }}"
      register: draytek_cli_result
      changed_when: false

    - name: Report the device response
      ansible.builtin.debug:
        var: draytek_cli_result.stdout

services:
  gateway:
    image: ${DEVEL_GATEWAY_IMAGE:-ghcr.io/kpeacocke/aax-gateway}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always
  pulp-api:
    image: ${DEVEL_PULP_IMAGE:-ghcr.io/kpeacocke/aax-pulp}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always
    command: ["run", "api"]
    environment:
      PULP_DB_HOST: hub-postgres
      PULP_DB_PORT: "5432"
      PULP_DB_NAME: hub
      PULP_DB_USER: galaxy
      PULP_DB_PASSWORD: ${HUB_DB_PASSWORD}
      PULP_REDIS_HOST: hub-redis
      PULP_REDIS_PORT: "6379"
      PULP_SECRET_KEY: ${PULP_SECRET_KEY}
      WITH_MIGRATIONS: "1"
      GUNICORN_PORT: "24817"
    volumes:
      - hub_pulp_certs:/etc/pulp/certs
  pulp-content:
    image: ${DEVEL_PULP_IMAGE:-ghcr.io/kpeacocke/aax-pulp}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always
    command: ["run", "content-app"]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:24816/pulp/content/); echo $$code | grep -Eq '^(200|404)$$'"]
    environment:
      PULP_DB_HOST: hub-postgres
      PULP_DB_PORT: "5432"
      PULP_DB_NAME: hub
      PULP_DB_USER: galaxy
      PULP_DB_PASSWORD: ${HUB_DB_PASSWORD}
      PULP_REDIS_HOST: hub-redis
      PULP_REDIS_PORT: "6379"
      PULP_SECRET_KEY: ${PULP_SECRET_KEY}
      GUNICORN_PORT: "24816"
    volumes:
      - hub_pulp_certs:/etc/pulp/certs
  pulp-worker:
    image: ${DEVEL_PULP_IMAGE:-ghcr.io/kpeacocke/aax-pulp}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always
    command: ["run", "worker"]
    environment:
      PULP_DB_HOST: hub-postgres
      PULP_DB_PORT: "5432"
      PULP_DB_NAME: hub
      PULP_DB_USER: galaxy
      PULP_DB_PASSWORD: ${HUB_DB_PASSWORD}
      PULP_REDIS_HOST: hub-redis
      PULP_REDIS_PORT: "6379"
      PULP_SECRET_KEY: ${PULP_SECRET_KEY}
      GUNICORN_PORT: "24817"
    volumes:
      - hub_pulp_certs:/etc/pulp/certs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,pathlib,sys;
          paths=pathlib.Path('/proc').glob('[0-9]*/cmdline');
          sys.exit(not any(p.parent.name != str(os.getpid()) and
          any(term in p.read_bytes() for term in (b'pulpcore-worker', b'pulpcore.tasking.entrypoint'))
          for p in paths if p.exists()))
  galaxy-ng:
    image: ${DEVEL_GALAXY_IMAGE:-ghcr.io/kpeacocke/aax-galaxy-ng}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always
    command: ["run", "api"]
    environment:
      PULP_DB_HOST: hub-postgres
      PULP_DB_PORT: "5432"
      PULP_DB_NAME: hub
      PULP_DB_USER: galaxy
      PULP_DB_PASSWORD: ${HUB_DB_PASSWORD}
      SECRET_KEY: ${GALAXY_SECRET_KEY}
      PULP_SECRET_KEY: ${PULP_SECRET_KEY}
      GUNICORN_PORT: "8000"
    volumes:
      - hub_pulp_certs:/etc/pulp/certs
  awx-web:
    image: ${DEVEL_AWX_IMAGE:-ghcr.io/kpeacocke/aax-awx}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always
    volumes:
      - ${AAX_AWX_CACHE_FILE:-./compat/awx-cache.py}:/var/lib/awx/venv/awx/lib64/python3.12/site-packages/awx/main/cache.py:ro
  awx-task:
    image: ${DEVEL_AWX_IMAGE:-ghcr.io/kpeacocke/aax-awx}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always
    volumes:
      - ${AAX_AWX_CACHE_FILE:-./compat/awx-cache.py}:/var/lib/awx/venv/awx/lib64/python3.12/site-packages/awx/main/cache.py:ro

  awx-receptor:
    image: ${DEVEL_AWX_EE_IMAGE:-ghcr.io/kpeacocke/aax-awx-ee}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always

  receptor-execution:
    image: ${DEVEL_AWX_EE_IMAGE:-ghcr.io/kpeacocke/aax-awx-ee}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always

  receptor-hop:
    image: ${DEVEL_RECEPTOR_IMAGE:-ghcr.io/kpeacocke/aax-receptor}:${DEVEL_IMAGE_TAG:-devel}
    pull_policy: always

  eda-controller:
    image: ${DEVEL_EDA_IMAGE:-ghcr.io/kpeacocke/aax-eda-controller}:${DEVEL_EDA_IMAGE_TAG:-${DEVEL_IMAGE_TAG:-devel}}
    pull_policy: always
    environment: &eda-runtime-environment
      EDA_DB_HOST: eda-postgres
      EDA_DB_PORT: "5432"
      EDA_DB_NAME: ${EDA_DB_NAME:-eda}
      EDA_DB_USER: ${EDA_DB_USER:-eda}
      EDA_DB_PASSWORD: ${EDA_DB_PASSWORD}
      EDA_SECRET_KEY: ${EDA_SECRET_KEY:-${SECRET_KEY}}
      EDA_ALLOWED_HOSTS: ${EDA_ALLOWED_HOSTS:-'["localhost","127.0.0.1","eda-controller"]'}
      EDA_RESOURCE_SERVER__URL: "@none None"
      EDA_ALLOW_LOCAL_RESOURCE_MANAGEMENT: "true"
      EDA_CONTROLLER_URL: ${EDA_CONTROLLER_URL:-http://awx-web:8052}
      EDA_CONTROLLER_SSL_VERIFY: "true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/_healthz', timeout=5).read()"]
      start_period: 120s

  eda-scheduler:
    image: ${DEVEL_EDA_IMAGE:-ghcr.io/kpeacocke/aax-eda-controller}:${DEVEL_EDA_IMAGE_TAG:-${DEVEL_IMAGE_TAG:-devel}}
    pull_policy: always
    profiles: [eda]
    restart: unless-stopped
    command: [scheduler]
    environment: *eda-runtime-environment
    networks: [eda-network]
    depends_on:
      eda-controller:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  eda-worker:
    image: ${DEVEL_EDA_IMAGE:-ghcr.io/kpeacocke/aax-eda-controller}:${DEVEL_EDA_IMAGE_TAG:-${DEVEL_IMAGE_TAG:-devel}}
    pull_policy: always
    profiles: [eda]
    restart: unless-stopped
    command: [worker]
    environment: *eda-runtime-environment
    networks: [eda-network, awx-network]
    depends_on:
      eda-controller:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  hub_pulp_certs:
    name: aax_devel_hub_pulp_certs
